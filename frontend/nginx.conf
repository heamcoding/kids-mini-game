# per-client-IP limit on the API. Behind another proxy/CDN, restore the real client IP first
# (real_ip_header / set_real_ip_from), otherwise every visitor shares that proxy's bucket.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    # API: same origin as the app, so the browser needs no CORS and the backends need no public port.
    # Spring owns /api/settings; FastAPI owns /records and /stats (mounted here under /api).
    location ^~ /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;

        location = /api/settings { proxy_pass http://spring:8080; }
        location = /api/records  { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://fastapi:8000; }
        location = /api/stats    { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://fastapi:8000; }
        location ^~ /api/ { return 404; }
    }

    # hashed bundles/images/fonts/maps: cache forever. ^~ stops the regex block below from winning.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # must always revalidate (service worker, manifest, entry html)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # any other file-like path (has an extension): real file or 404, never index.html
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # extension-less paths are SPA navigations
    location / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
