server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    # hashed bundles: cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # must always revalidate (service worker, manifest, entry html)
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # other static files (icons, sprites): files only, 404 when missing
    location ~* \.(png|jpg|jpeg|svg|webp|ico|gif|woff2?|json|txt|map)$ {
        try_files $uri =404;
    }

    # SPA fallback for navigations only
    location / {
        try_files $uri @spa;
    }
    location @spa {
        add_header Cache-Control "no-cache";
        rewrite ^ /index.html break;
    }
}
