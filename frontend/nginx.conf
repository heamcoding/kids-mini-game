server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    # hashed bundles/images/fonts/maps: cache forever. ^~ stops the regex block below from winning.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # must always revalidate (service worker, manifest, entry html)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # any other file-like path (has an extension): real file or 404, never index.html
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # extension-less paths are SPA navigations
    location / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
